[build]
builder = "NIXPACKS"
buildCommand = "cd apps/api && npx prisma generate && pnpm run build"

[deploy]
startCommand = "cd apps/api && npx prisma migrate resolve --rolled-back 20260311_init && npx prisma migrate deploy && node dist/main.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Trigger redeploy
