name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - claude/mvp-multitenant-saas-0D7dQ
      - codex/smallest-ai-platform

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: voice_ai_ci
          POSTGRES_USER: voice_ai_ci
          POSTGRES_PASSWORD: voice_ai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_ai_ci -d voice_ai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://voice_ai_ci:voice_ai_ci@localhost:5432/voice_ai_ci
      TEST_DATABASE_URL: postgresql+asyncpg://voice_ai_ci:voice_ai_ci@localhost:5432/voice_ai_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: alembic upgrade head
      - run: python -m ruff check app tests migrations
      - run: python -m ruff format --check app tests migrations
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm 10 can fall back to the retired quick-audit endpoint and report a
      # misleading "Invalid package tree" for a valid lockfile. Keep the Node
      # runtime stable while using npm's supported bulk-advisory client.
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:session-boundary
      - run: npm run lint
      - run: npm run build
