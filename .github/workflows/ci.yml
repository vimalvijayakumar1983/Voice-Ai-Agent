name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - claude/mvp-multitenant-saas-0D7dQ
      - codex/smallest-ai-platform

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: voice_ai_ci
          POSTGRES_USER: voice_ai_ci
          POSTGRES_PASSWORD: voice_ai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_ai_ci -d voice_ai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://voice_ai_ci:voice_ai_ci@localhost:5432/voice_ai_ci
      TEST_DATABASE_URL: postgresql+asyncpg://voice_ai_ci:voice_ai_ci@localhost:5432/voice_ai_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - run: alembic upgrade head
      - run: python -m ruff check app tests migrations
      - run: python -m ruff format --check app tests migrations
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm 10 can fall back to the retired quick-audit endpoint and report a
      # misleading "Invalid package tree" for a valid lockfile. Keep the Node
      # runtime stable while using npm's supported bulk-advisory client.
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Audit production dependencies
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            audit_log="$(mktemp)"
            audit_status=0
            if timeout --kill-after=10s 90s npm audit --omit=dev --audit-level=high 2>&1 | tee "$audit_log"; then
              rm -f "$audit_log"
              exit 0
            else
              audit_status="${PIPESTATUS[0]}"
            fi

            # Vulnerability findings are deterministic and must fail
            # immediately. Retry only registry/network failures, which have
            # otherwise made a clean dependency tree randomly fail CI.
            if [ "$audit_status" -ne 124 ] && [ "$audit_status" -ne 137 ] && ! grep -Eiq '503|service unavailable|429|too many requests|EAI_AGAIN|ECONNRESET|ETIMEDOUT|ENETUNREACH|audit endpoint returned an error' "$audit_log"; then
              rm -f "$audit_log"
              exit 1
            fi
            rm -f "$audit_log"

            if [ "$attempt" -eq 3 ]; then
              echo "npm audit service remained unavailable after 3 attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - run: npm run test:session-boundary
      - run: npm run lint
      - run: npm run build
