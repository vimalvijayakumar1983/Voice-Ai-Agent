version: "3.9"

services:
  # ----------------------------------------
  # PostgreSQL 16
  # ----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: voice-ai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: voice_ai_user
      POSTGRES_PASSWORD: change_me_in_production
      POSTGRES_DB: voice_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_ai_user -d voice_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------
  # Redis 7
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: voice-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # MinIO (S3-compatible object storage)
  # ----------------------------------------
  minio:
    image: minio/minio:latest
    container_name: voice-ai-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_access_key
      MINIO_ROOT_PASSWORD: minio_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # MinIO bucket initialization
  # ----------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: voice-ai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minio_access_key minio_secret_key;
        mc mb --ignore-existing local/voice-ai-recordings;
        mc mb --ignore-existing local/voice-ai-assets;
        mc anonymous set download local/voice-ai-assets;
        exit 0;
      "

  # ----------------------------------------
  # MailHog (SMTP testing)
  # ----------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: voice-ai-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
